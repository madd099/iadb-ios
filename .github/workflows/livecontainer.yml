name: Build IPA for LiveContainer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List directory contents
        run: |
          echo "--- Listing root ---"
          ls -la
          echo "--- Searching for projects ---"
          find . -name "*.xcodeproj"
          find . -name "*.xcworkspace"

      - name: Build App (Unsigned)
        run: |
          # Ищем workspace, игнорируя Pods
          WORKSPACE=$(find . -name "*.xcworkspace" -not -path "*/Pods/*" | head -n 1)
          # Ищем project
          PROJECT=$(find . -name "*.xcodeproj" | head -n 1)
          
          if [ -n "$WORKSPACE" ]; then
            echo "Found workspace: $WORKSPACE"
            SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '/Schemes:/ {found=1; next} found && NF {print $0}' | head -n 1 | xargs)
            if [ -z "$SCHEME" ]; then
              SCHEME=$(basename "$WORKSPACE" .xcworkspace)
            fi
            echo "Using scheme: $SCHEME"
            
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath ./build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              ONLY_ACTIVE_ARCH=NO \
              build
              
          elif [ -n "$PROJECT" ]; then
            echo "Found project: $PROJECT"
            SCHEME=$(xcodebuild -list -project "$PROJECT" | awk '/Schemes:/ {found=1; next} found && NF {print $0}' | head -n 1 | xargs)
            if [ -z "$SCHEME" ]; then
              SCHEME=$(basename "$PROJECT" .xcodeproj)
            fi
            echo "Using scheme: $SCHEME"
            
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath ./build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              ONLY_ACTIVE_ARCH=NO \
              build
              
          else
            echo "ERROR: No Xcode project or workspace found!"
            exit 1
          fi

      - name: Create IPA
        run: |
          APP_PATH=$(find ./build/Build/Products -name "*.app" -type d | head -n 1)
          echo "App path: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iadb-livecontainer-ipa
          path: app.ipa
