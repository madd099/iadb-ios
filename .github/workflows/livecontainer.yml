name: Build IPA for LiveContainer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build App (Unsigned)
        run: |
          PROJECT=$(find . -name "*.xcodeproj" -maxdepth 1 | head -n 1)
          echo "Found project: $PROJECT"
          
          SCHEME=$(xcodebuild -list -project "$PROJECT" | awk '/Schemes:/ {found=1; next} found && NF {print $0}' | head -n 1 | xargs)
          if [ -z "$SCHEME" ]; then
            SCHEME=$(basename "$PROJECT" .xcodeproj)
          fi
          echo "Using scheme: $SCHEME"
          
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Create IPA
        run: |
          APP_PATH=$(find ./build/Build/Products -name "*.app" -type d | head -n 1)
          echo "App path: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iadb-livecontainer-ipa
          path: app.ipa
